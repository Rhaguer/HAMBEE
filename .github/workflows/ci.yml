name: Validar y empaquetar inferencia
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Pruebas del contrato
        run: python smoke.py "$(find validacion/test/P -name '*.jpg' -print -quit)"
      - name: Regresiones de calidad y latencia
        run: |
          python benchmark.py validacion --output benchmark-ci.json
          python quality_gate.py benchmark-ci.json
      - name: Construir imagen
        run: docker build -t eva4:ci .
      - name: Probar el contenedor por HTTP
        run: |
          docker run -d --name eva4-ci -p 127.0.0.1:8000:8000 eva4:ci
          for attempt in {1..30}; do
            if curl -fs --max-time 2 http://127.0.0.1:8000/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs eva4-ci
              exit 1
            fi
            sleep 2
          done
          python smoke.py "$(find validacion/test/P -name '*.jpg' -print -quit)" --url http://127.0.0.1:8000
      - name: Evidencia de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediciones
          path: benchmark-ci.json
      - name: Empaquetar versión aprobada
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("models/metadata.json"))["model_version"]'
          docker tag eva4:ci "eva4:${GITHUB_REF_NAME}"
          docker save "eva4:${GITHUB_REF_NAME}" | gzip > eva4-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: eva4-image
          path: eva4-image.tar.gz

